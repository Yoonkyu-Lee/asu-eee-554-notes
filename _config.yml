# GitHub Pages는 이 저장소를 Jekyll로 빌드한다.
# 노트 HTML은 그대로 복사되지만, 설정이 없으면 저장소의 .md 파일까지
# 웹페이지로 변환해서 공개한다. 실제로 CLAUDE.md가 CLAUDE.html로 배포되고 있었다.
# 사이트에 필요 없는 내부 파일은 여기서 명시적으로 뺀다.
#
# 주의 1: exclude를 지정하면 Jekyll의 기본 제외 목록을 덮어쓴다.
#         기본값(node_modules, vendor/bundle 등)도 같이 적어야 한다.
# 주의 2: vendor/ 를 통째로 빼면 안 된다. vendor/pdf.js/ 가 리더 런타임이라
#         빼는 순간 슬라이드가 안 뜬다. Jekyll 기본값도 vendor 전체가 아니라
#         vendor/bundle 같은 Ruby 관련 하위 폴더만 뺀다.

exclude:
  # 이 저장소에서 추가로 빼는 것
  - CLAUDE.md
  - scripts/
  - package.json
  - shots/

  # Jekyll 기본 제외 목록 (덮어쓰기 때문에 다시 적어야 한다)
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - package-lock.json
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
